<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign generator</title>
  </head>
  <body>
    <div class="button-container">
      <div class="button-wrapper">
        <button id="generate-button">Generate</button>
        <button id="save-button">Save picture</button>
        <button id="palette-button">Change color</button>
      </div>
      <p>Press left arrow key to undo or right arrow key to redo.</p>
    </div>
    <div class="columns-wrapper">
      <label for="columns-slider">Columns</label>
      <input
        id="columns-slider"
        class="columns-slider"
        type="range"
        min="4"
        max="6"
        value="5"
      />
    </div>
    <div class="density-wrapper">
      <label for="density-slider">Density</label>
      <input
        id="density-slider"
        class="density-slider"
        type="range"
        min="1"
        max="10"
        value="7"
      />
    </div>
    <a class="github-link" href="https://github.com/omzeton/logo-sign-generator"
      ><img src="/github.svg" />GitHub repo</a
    >
    <script type="module" src="/main.js"></script>
  </body>
</html>
