<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign generator</title>
  </head>
  <body>
    <div class="button-container">
      <div class="button-wrapper">
        <button id="regenerate-button">Regenerate</button>
        <button id="save-button">Save picture</button>
        <button id="palette-button">Change color</button>
      </div>
      <p>Press left arrow key to undo or right arrow key to redo.</p>
    </div>
    <div class="resolution-wrapper">
      <label for="resolution-slider">Resolution</label>
      <input
        id="resolution-slider"
        class="resolution-slider"
        type="range"
        min="1"
        max="3"
        value="3"
      />
    </div>
    <div class="size-wrapper">
      <label for="size-slider">Size</label>
      <input
        id="size-slider"
        class="size-slider"
        type="range"
        min="1"
        max="10"
        value="1"
      />
    </div>
    <a class="github-link" href="https://github.com/omzeton/logo-sign-generator"
      ><img src="/github.svg" />GitHub repo</a
    >
    <script type="module" src="/main.js"></script>
  </body>
</html>
